name: Central standards and structured-result validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standards-and-records:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned validation dependencies
        run: |
          python -m pip install "jsonschema[format]==4.26.0" "PyYAML==6.0.2"

      - name: Check out exact central standards revision
        env:
          CENTRAL_SHA: db503f0eb579bdbcac702e44237a6610c34690e7
        run: |
          git init "$RUNNER_TEMP/central-standards"
          git -C "$RUNNER_TEMP/central-standards" remote add origin https://github.com/lm846802297-bit/high-energy-theory-research.git
          git -C "$RUNNER_TEMP/central-standards" fetch --no-tags --depth=1 origin "$CENTRAL_SHA"
          git -C "$RUNNER_TEMP/central-standards" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/central-standards" rev-parse HEAD)" = "$CENTRAL_SHA"

      - name: Validate standards lock against exact central commit
        run: |
          python schemas/validate_standards_adoption.py \
            --repo-root . \
            --central-root "$RUNNER_TEMP/central-standards" \
            --require-central-commit \
            --lock docs/standards-lock.yaml

      - name: Validate task and run provenance records when present
        env:
          PROJECT_ROOT: ${{ github.workspace }}
          CENTRAL_ROOT: ${{ runner.temp }}/central-standards
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"]).resolve()
          central = Path(os.environ["CENTRAL_ROOT"])
          validator = root / "schemas/validate_standards_adoption.py"
          lock = root / "docs/standards-lock.yaml"

          def validate(extra):
              command = [
                  "python", str(validator),
                  "--repo-root", str(root),
                  "--central-root", str(central),
                  "--require-central-commit",
                  "--lock", str(lock),
                  *extra,
              ]
              subprocess.run(command, cwd=root, check=True)

          task_dir = root / "docs/standards-provenance/tasks"
          if task_dir.is_dir():
              for task in sorted(task_dir.glob("*.json")):
                  extra = ["--task-provenance", str(task)]
                  report = root / "docs/standards-provenance/reports" / task.name
                  if report.is_file():
                      extra.extend(["--report", str(report)])
                  validate(extra)

          ignored = {".git", ".venv", "node_modules", "__pycache__"}
          for manifest_path in root.rglob("run_manifest.json"):
              if ignored.intersection(manifest_path.parts):
                  continue
              try:
                  record = json.loads(manifest_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              if record.get("extensions", {}).get("standards_provenance") is not None:
                  validate(["--run-manifest", str(manifest_path)])
          PY

      - name: Validate RCRPS schemas and validator syntax
        run: |
          python -m compileall -q schemas
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in (
              Path("schemas/research-result-record-v1.0.1.schema.json"),
              Path("schemas/standards-adoption-v1.0.0.schema.json"),
          ):
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              print(f"PASS schema: {path}")
          PY

      - name: Validate existing repository SHA-256 inventory
        run: python tools/validate_provenance.py
